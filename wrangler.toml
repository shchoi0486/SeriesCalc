name = "seriescalc"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# ── 환경변수 안내 ──
# NEXT_PUBLIC_* (클라이언트) 변수는 빌드 시점에 주입되어야 하므로
# Cloudflare Pages 대시보드 > 설정 > Build & deployments > Build environment variables 에서 지정:
#   NEXT_PUBLIC_SITE_URL=https://seriescalc.com
#   NEXT_PUBLIC_SUPABASE_URL=...
#   NEXT_PUBLIC_UPSTASH_REDIS_REST_URL=...
#   NEXT_PUBLIC_UPSTASH_REDIS_REST_TOKEN=...
#   NEXT_PUBLIC_ADSENSE_CLIENT=...
#
# 서버 전용 비밀값(서비스 키 등)은 아래 [vars] 또는 Pages 환경변수(Runtime)에 추가:
# [vars]
#   SUPABASE_SERVICE_ROLE_KEY = "..."
